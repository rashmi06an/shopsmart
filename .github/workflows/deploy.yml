name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd shopsmart || git clone https://github.com/rashmi06an/shopsmart.git

            cd shopsmart
            git pull origin main

            cd server
            npm install

            pkill node || true

            nohup node src/index.js > output.log 2>&1 &