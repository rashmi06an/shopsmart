name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            REPO_URL="${{ secrets.EC2_REPO_URL }}"
            BRANCH="${{ secrets.EC2_BRANCH }}"
            if [ -z "$BRANCH" ]; then BRANCH="main"; fi

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all
            git reset --hard "origin/$BRANCH"

            cd server
            npm ci --omit=dev

            if command -v pm2 >/dev/null 2>&1; then
              pm2 startOrRestart ecosystem.config.js --only shopsmart-api || pm2 start src/index.js --name shopsmart-api
              pm2 save
            else
              pkill -f "node src/index.js" || true
              nohup node src/index.js > output.log 2>&1 &
            fi
