name: Phase 3a — Docker Build & ECR Push

on:
  workflow_call:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag metadata
        id: meta
        run: |
          TAG="${GITHUB_SHA::8}"
          # Fetch ECR URL directly via AWS CLI
          ECR_URL=$(aws ecr describe-repositories --repository-names shopsmart --query 'repositories[0].repositoryUri' --output text)
          echo "image_tag=${TAG}"           >> $GITHUB_OUTPUT
          echo "image_uri=${ECR_URL}:${TAG}" >> $GITHUB_OUTPUT
          echo "ecr_url=${ECR_URL}"         >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --tag shopsmart-api:${{ steps.meta.outputs.image_tag }} \
            --label "git.sha=${{ github.sha }}" \
            --label "build.run=${{ github.run_number }}" \
            ./server

      - name: Push image to ECR
        run: |
          ECR_URL="${{ steps.meta.outputs.ecr_url }}"
          TAG="${{ steps.meta.outputs.image_tag }}"

          docker tag shopsmart-api:${TAG} ${ECR_URL}:${TAG}
          docker tag shopsmart-api:${TAG} ${ECR_URL}:latest

          docker push ${ECR_URL}:${TAG}
          docker push ${ECR_URL}:latest

          echo "✅ Pushed ${ECR_URL}:${TAG}"
