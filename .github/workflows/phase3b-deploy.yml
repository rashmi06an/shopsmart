name: Phase 3b — Deploy to ECS

on:
  workflow_call:

jobs:
  deploy-ecs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Get ECR image URIs
        id: meta
        run: |
          TAG="${GITHUB_SHA::8}"
          FRONTEND_ECR_URL=$(aws ecr describe-repositories --repository-names shopsmart-frontend --query 'repositories[0].repositoryUri' --output text)
          BACKEND_ECR_URL=$(aws ecr describe-repositories --repository-names shopsmart-backend --query 'repositories[0].repositoryUri' --output text)
          echo "frontend_image_uri=${FRONTEND_ECR_URL}:${TAG}" >> $GITHUB_OUTPUT
          echo "backend_image_uri=${BACKEND_ECR_URL}:${TAG}" >> $GITHUB_OUTPUT

      - name: Download current frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition shopsmart-frontend \
            --query taskDefinition \
            > frontend-task-definition.json

      - name: Render updated frontend task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  frontend-task-definition.json
          container-name:   shopsmart-frontend
          image:            ${{ steps.meta.outputs.frontend_image_uri }}

      - name: Deploy frontend to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.frontend-task-def.outputs.task-definition }}
          service:                    shopsmart-frontend
          cluster:                    shopsmart-cluster
          wait-for-service-stability: true

      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition shopsmart-backend \
            --query taskDefinition \
            > backend-task-definition.json

      - name: Render updated backend task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  backend-task-definition.json
          container-name:   shopsmart-backend
          image:            ${{ steps.meta.outputs.backend_image_uri }}

      - name: Deploy backend to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.backend-task-def.outputs.task-definition }}
          service:                    shopsmart-backend
          cluster:                    shopsmart-cluster
          wait-for-service-stability: true
