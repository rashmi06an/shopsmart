name: PR — Build & Test

# This workflow runs on every pull_request for fast feedback.
# It does NOT deploy — deployment is handled by ci-cd.yml on merge to main.
on:
  pull_request:

jobs:
  build-test:
    name: Build & Test (PR Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint client (non-blocking)
        run: npm run lint || true
        working-directory: client

      - name: Lint server (non-blocking)
        run: npm run lint || true
        working-directory: server

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run unit tests (client)
        working-directory: client
        run: |
          npx vitest run \
            --reporter=default \
            --reporter=json \
            --outputFile=../reports/unit-tests.json

      - name: Run integration tests (server)
        working-directory: server
        run: |
          npx jest \
            --config jest.config.js \
            --runInBand \
            --json \
            --outputFile=../reports/integration-tests.json \
            tests/
        env:
          NODE_OPTIONS: "--max-old-space-size=512"

      - name: Build client
        run: npm run build
        working-directory: client

      # Upload reports so reviewers can inspect from the PR Actions tab
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-reports-${{ github.run_number }}
          path: reports/
          retention-days: 7
