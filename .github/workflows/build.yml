name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run client lint (non-blocking for warnings)
        working-directory: client
        run: npm run lint || true

      - name: Run server lint (non-blocking for warnings)
        working-directory: server
        run: npm run lint || true

      - name: Run unit tests (client)
        working-directory: client
        env:
          NODE_OPTIONS: --localstorage-file=/tmp/shopsmart-localstorage
        run: npm run test -- --run

      - name: Run integration tests (server)
        working-directory: server
        env:
          NODE_OPTIONS: --localstorage-file=/tmp/shopsmart-localstorage
        run: npm run test:integration

      - name: Build client
        working-directory: client
        run: npm run build
