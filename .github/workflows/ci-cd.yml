name: Master CI/CD Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: 

# ──────────────────────────────────────────────────────────────────────────────
# Orchestrator Jobs
# These jobs call the modular workflows and enforce execution order using 'needs:'
# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 1 — Run Tests & Upload Reports
  # ════════════════════════════════════════════════════════════════════════════
  Phase-1-Test:
    name: Phase 1 (Test)
    uses: ./.github/workflows/phase1-test.yml

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 2 — Terraform: Provision Infrastructure
  # Runs only on push to main, and ONLY IF Phase 1 passes.
  # ════════════════════════════════════════════════════════════════════════════
  Phase-2-Terraform:
    name: Phase 2 (Terraform Apply)
    needs: [Phase-1-Test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/phase2-terraform.yml
    secrets: inherit

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 3a — Docker Build & Push to ECR
  # Runs ONLY IF Phase 2 passes.
  # ════════════════════════════════════════════════════════════════════════════
  Phase-3a-Docker-Build:
    name: Phase 3a (Docker Build & ECR Push)
    needs: [Phase-2-Terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/phase3a-build-push.yml
    secrets: inherit

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 3b — Deploy to ECS Fargate & Verify
  # Runs ONLY IF Phase 3a passes.
  # ════════════════════════════════════════════════════════════════════════════
  Phase-3b-ECS-Deploy:
    name: Phase 3b (Deploy to ECS Fargate)
    needs: [Phase-3a-Docker-Build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/phase3b-deploy.yml
    secrets: inherit
